/* Massive unified snapshot uses I:SPX for the S&P 500 index.

  spx:'I:SPX',

const fmt = n =>
  Number.isFinite(n)
    ? '$' + n.toLocaleString('en-US',{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })
    : '—';

const pct = n =>
  Number.isFinite(n)
    ? (n >= 0 ? '+' : '') + n.toFixed(2) + '%'
    : '—';

function compact(n){
  if(!Number.isFinite(n)) return '—';
  if(n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if(n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
  if(n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
  return fmt(n);
}

function apiUrl(path, params = {}){
  const u = new URL(API_BASE + path);

  Object.entries(params).forEach(([key,value]) => {
    if(value !== undefined && value !== null && value !== '')
      u.searchParams.set(key,value);
  });

  u.searchParams.set('apiKey', MASSIVE_API_KEY);

  return u.toString();
}

async function api(path, params = {}){
  if(
    !MASSIVE_API_KEY ||
    MASSIVE_API_KEY === 'YOUR_MASSIVE_API_KEY'
  ){
    throw new Error('Put your Massive API key in MASSIVE_API_KEY first.');
  }

  const response = await fetch(apiUrl(path,params),{
    cache:'no-store'
  });

  if(!response.ok){
    throw new Error(
      'Massive API request failed (' + response.status + ')'
    );
  }

  const json = await response.json();

  if(json.status === 'ERROR'){
    throw new Error(
      json.error || json.message || 'Massive API error'
    );
  }

  return json;
}

/* ------------------------------------------------------------
   DATE HELPERS
------------------------------------------------------------ */

function dateString(daysAgo = 0){
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);

  return d.toISOString().slice(0,10);
}

/* ------------------------------------------------------------
   RANGE SETTINGS
------------------------------------------------------------ */

function rangeSettings(range){

  if(range === '1d'){
    return {
      from:dateString(3),
      multiplier:5,
      timespan:'minute',
      limit:200
    };
  }

  if(range === '5d'){
    return {
      from:dateString(10),
      multiplier:15,
      timespan:'minute',
      limit:500
    };
  }

  if(range === '1mo'){
    return {
      from:dateString(45),
      multiplier:1,
      timespan:'hour',
      limit:500
    };
  }

  if(range === '3mo'){
    return {
      from:dateString(120),
      multiplier:1,
      timespan:'day',
      limit:500
    };
  }

  return {
    from:dateString(400),
    multiplier:1,
    timespan:'day',
    limit:500
  };
}

/* ------------------------------------------------------------
   SNAPSHOT
------------------------------------------------------------ */

async function fetchSnapshot(sym){

  const j = await api(
    '/v2/snapshot/locale/us/markets/stocks/tickers/' +
    encodeURIComponent(sym)
  );

  if(!j.ticker){
    throw new Error('No snapshot returned for ' + sym);
  }

  const t = j.ticker;

  const day = t.day || {};
  const prev = t.prevDay || {};
  const trade = t.lastTrade || {};
  const minute = t.min || {};

  const price =
    Number(trade.p) ||
    Number(minute.c) ||
    Number(day.c) ||
    Number(prev.c);

  if(!Number.isFinite(price)){
    throw new Error('No current price returned for ' + sym);
  }

  const previousClose =
    Number(prev.c) ||
    Number(day.c);

  const change =
    Number(t.todaysChange);

  const percent =
    Number(t.todaysChangePerc);

  return {
    sym,
    price,
    prev:Number.isFinite(previousClose)
      ? previousClose
      : price,

    change:Number.isFinite(change)
      ? change
      : price - previousClose,

    percent:Number.isFinite(percent)
      ? percent
      : (
          previousClose
          ? (price-previousClose)/previousClose*100
          : 0
        ),

    open:Number(day.o),
    high:Number(day.h),
    low:Number(day.l),
    volume:Number(day.v),

    fiftyTwoHigh:NaN,
    fiftyTwoLow:NaN,
    marketCap:NaN,

    points:[],
    lastUpdated:Number(t.updated)
  };
}

/* ------------------------------------------------------------
   HISTORICAL CHART
------------------------------------------------------------ */

async function fetchChart(sym,range){

  const settings = rangeSettings(range);

  const j = await api(
    '/v2/aggs/ticker/' +
    encodeURIComponent(sym) +
    '/range/' +
    settings.multiplier + '/' +
    settings.timespan + '/' +
    settings.from + '/' +
    dateString(0),
    {
      adjusted:'true',
      sort:'asc',
      limit:settings.limit
    }
  );

  const results = Array.isArray(j.results)
    ? j.results
    : [];

  return results
    .map(p => ({
      t:Number(p.t),
      p:Number(p.c),
      o:Number(p.o),
      h:Number(p.h),
      l:Number(p.l),
      v:Number(p.v || 0)
    }))
    .filter(p => Number.isFinite(p.p));
}

/* ------------------------------------------------------------
   FULL QUOTE + CHART
------------------------------------------------------------ */

async function fetchQuote(sym,range='1d'){

  const [snapshot,points] = await Promise.all([
    fetchSnapshot(sym),
    fetchChart(sym,range)
  ]);

  snapshot.points = points;

  return snapshot;
}

function showVol(){

/* ------------------------------------------------------------
   DRAW CHART
------------------------------------------------------------ */

function draw(d){

  const canvas =
    document.getElementById('canvas-' + d.sym);

  if(!canvas)return;

  const box = canvas.getBoundingClientRect();

  const ratio = window.devicePixelRatio || 1;

  const w = box.width;
  const h = box.height;

  canvas.width = w * ratio;
  canvas.height = h * ratio;

  const ctx = canvas.getContext('2d');

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  ctx.clearRect(0,0,w,h);

  const pts = d.points || [];

  if(pts.length < 2){

    ctx.fillStyle = '#777c84';
    ctx.font = '13px Arial';

    ctx.fillText(
      'Chart data unavailable',
      18,
      h/2
    );

    return;
  }

  const pad = {
    l:10,
    r:10,
    t:18,
    b:showVol() ? 48 : 18
  };

  const values = pts.map(p => p.p);

  const min = Math.min(...values);
  const max = Math.max(...values);

  const range = max - min || 1;

  /* Grid */

  for(let i=1;i<5;i++){

    const y =
      pad.t +
      (h-pad.t-pad.b)*i/5;

    ctx.strokeStyle = '#171a1f';

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y);
    ctx.stroke();
  }

  /* Volume */

  if(showVol()){

    const volumes =
      pts.map(p => p.v || 0);

    const maxVolume =
      Math.max(...volumes) || 1;

    const barWidth =
      Math.max(
        1,
        (w-pad.l-pad.r)/pts.length
      );

    ctx.fillStyle = '#1e252b';

    pts.forEach((p,i)=>{

      const bh =
        (p.v || 0) /
        maxVolume *
        (h-pad.b-10);

      ctx.fillRect(
        pad.l+i*barWidth,
        h-4-bh,
        Math.max(1,barWidth*.65),
        bh
      );

    });
  }

  /* Price line */

  ctx.beginPath();

  pts.forEach((p,i)=>{

    const x =
      pad.l +
      (w-pad.l-pad.r) *
      i/(pts.length-1);

    const y =
      pad.t +
      (h-pad.t-pad.b) *
      (1-(p.p-min)/range);

    if(i === 0)
      ctx.moveTo(x,y);
    else
      ctx.lineTo(x,y);

  });

  ctx.strokeStyle =
    d.change >= 0
      ? '#00c805'
      : '#ff4d4d';

  ctx.lineWidth = 2.2;
  ctx.lineJoin = 'round';

  ctx.stroke();
}

/* ------------------------------------------------------------
   CHART HOVER
------------------------------------------------------------ */

function attachHover(d){

  const wrap =
    document.getElementById(
      'wrap-' + d.sym
    );

  const tip =
    document.getElementById(
      'tip-' + d.sym
    );

  const cross =
    document.getElementById(
      'cross-' + d.sym
    );

  if(!wrap)return;

  wrap.onmousemove = e => {

    if(d.points.length < 2)return;

    const rect =
      wrap.getBoundingClientRect();

    const x =
      Math.max(
        0,
        Math.min(
          rect.width,
          e.clientX - rect.left
        )
      );

    const index =
      Math.round(
        x / rect.width *
        (d.points.length-1)
      );

    const p = d.points[index];

    const first =
      d.points[0].p;

    const change =
      first
        ? (p.p-first)/first*100
        : 0;

    tip.style.display = 'block';

    tip.style.left =
      Math.min(
        x+12,
        rect.width-190
      ) + 'px';

    tip.style.top =
      Math.max(
        8,
        e.clientY-rect.top-65
      ) + 'px';

    tip.innerHTML =
      '<b>' + fmt(p.p) + '</b><br>' +
      pct(change) +
      ' · ' +
      (p.p-first >= 0 ? '+' : '') +
      fmt(p.p-first) +
      ' from period start<br>' +
      new Date(p.t).toLocaleString() +
      '<br>O ' + fmt(p.o) +
      ' · H ' + fmt(p.h) +
      ' · L ' + fmt(p.l);

    cross.style.display = 'block';
    cross.style.left = x + 'px';
  };

  wrap.onmouseleave = () => {

    tip.style.display = 'none';
    cross.style.display = 'none';

  };
}

/* ------------------------------------------------------------
   LOAD ONE SYMBOL
------------------------------------------------------------ */

async function load(sym){

  try{

    data[sym] =
      await fetchQuote(
        sym,
        ranges[sym] || '1d'
      );

    render();

    return data[sym];

  }catch(error){

    console.warn(
      'Could not load ' + sym,
      error
    );

    const err =
      document.getElementById(
        'err-' + sym
      );

    if(err){

      err.style.display = 'block';

      err.textContent =
        error.message;

    }

    throw error;
  }
}

/* ------------------------------------------------------------
   REFRESH EVERYTHING
------------------------------------------------------------ */

async function refreshAll(){

  if(busy)return;

  busy = true;

  document.getElementById(
    'marketStatus'
  ).innerHTML =
    '<span class="status-dot"></span>Updating';

  const all = [
    ...new Set([
      ...symbols,
      ...WATCH_DEFAULTS,
      ...Object.values(INDEXES)
    ])
  ];

  let success = 0;

  /*
    Sequential loading prevents the free API tier from
    being hammered with simultaneous requests.
  */

  for(const sym of all){

    try{

      /*
        Index tickers are handled separately below.
      */

      if(
        sym === 'I:SPX' ||
        sym === 'I:NDX' ||
        sym === 'I:DJI'
      ){

        const j =
          await api(
            '/v3/snapshot',
            {ticker:sym}
          );

        const result =
          j.results?.[0];

        if(result){

          const session =
            result.session || {};

          data[sym] = {
            sym,
            price:Number(session.price),
            prev:Number(session.previous_close),
            change:Number(session.change),
            percent:Number(session.change_percent),
            open:Number(session.open),
            high:Number(session.high),
            low:Number(session.low),
            volume:Number(session.volume),
            points:[]
          };

          success++;
        }

      }else{

        data[sym] =
          await fetchQuote(
            sym,
            ranges[sym] || '1d'
          );

        success++;
      }

    }catch(error){

      console.warn(
        'Could not load ' +
        sym +
        ': ' +
        error.message
      );

    }

    /*
      Small pause between requests.
    */

    await new Promise(
      resolve => setTimeout(resolve,120)
    );
  }

  lastSuccessfulUpdate =
    new Date();

  render();

  document.getElementById(
    'update-time'
  ).textContent =
    lastSuccessfulUpdate.toLocaleTimeString();

  document.getElementById(
    'connection-note'
  ).textContent =
    success
      ? 'Massive · ' + success + ' symbols loaded'
      : 'Waiting for data';

  document.getElementById(
    'feedNotice'
  ).innerHTML =
    '<b style="color:#fff">Live feed:</b> ' +
    (
      success
        ? 'Connected to Massive.'
        : 'Could not connect to Massive.'
    );

  document.getElementById(
    'marketStatus'
  ).innerHTML =
    success
      ? '<span class="status-dot"></span>Market data loaded'
      : '<span class="status-dot" style="background:#ff4d4d"></span>Live feed unavailable';

  busy = false;
}

/* ------------------------------------------------------------
   FULLSCREEN
------------------------------------------------------------ */

function fullscreenChart(sym){

  const wrap =
    document.getElementById(
      'wrap-' + sym
    );

  if(!wrap)return;

  wrap.classList.toggle(
    'fullscreen'
  );

  document.documentElement.style.overflow =
    wrap.classList.contains('fullscreen')
      ? 'hidden'
      : '';

  setTimeout(
    () => draw(data[sym]),
    50
  );
}

document.addEventListener(
  'keydown',
  e => {

    if(e.key === 'Escape'){

      document
        .querySelectorAll(
          '.chart-wrap.fullscreen'
        )
        .forEach(w =>
          w.classList.remove('fullscreen')
        );

      document.documentElement.style.overflow =
        '';

      redrawAll();
    }
  }
);

/* ------------------------------------------------------------
   MARKET STATUS
------------------------------------------------------------ */

function updatePulse(){

  const now = new Date();

  const parts =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:MARKET_TZ,
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit',
        hour12:false
      }
    ).formatToParts(now);

  const h =
    Number(
      parts.find(
        x => x.type === 'hour'
      ).value
    );

  const m =
    Number(
      parts.find(
        x => x.type === 'minute'
      ).value
    );

  const mins =
    h*60+m;

  const weekday =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:MARKET_TZ,
        weekday:'short'
      }
    ).format(now);

  const open =
    weekday !== 'Sat' &&
    weekday !== 'Sun' &&
    mins >= 570 &&
    mins < 960;

  const session =
    document.getElementById(
      'market-session'
    );

  const countdown =
    document.getElementById(
      'market-countdown'
    );

  if(session){

    session.textContent =
      open
        ? 'US market open'
        : 'US market closed / pre-market / after-hours';

  }

  if(countdown){

    countdown.textContent =
      open
        ? 'Closes in ' +
          Math.max(0,960-mins) +
          'm'
        : 'Updates every 60s';

  }

  const amazon =
    data.AMZN;

  if(amazon){

    const move =
      document.getElementById(
        'amzn-session-move'
      );

    if(move){

      move.textContent =
        pct(amazon.percent);

      move.className =
        'row-right ' +
        (
          amazon.change >= 0
            ? 'up'
            : 'down'
        );
    }

    const range =
      document.getElementById(
        'amzn-day-range'
      );

    if(range){

      range.textContent =
        fmt(amazon.low) +
        ' — ' +
        fmt(amazon.high);
    }

    const position =
      document.getElementById(
        'amzn-range-position'
      );

    const span =
      amazon.high-amazon.low;

    if(position){

      position.textContent =
        span > 0
          ? Math.round(
              (amazon.price-amazon.low) /
              span *
              100
            ) + '% of range'
          : '—';
    }
  }
}

/* ------------------------------------------------------------
   MAIN RENDER
------------------------------------------------------------ */

function render(){

  const grid =
    document.getElementById(
      'stockGrid'
    );

  if(!grid)return;

  grid.innerHTML =
    symbols.map(sym => {

      if(data[sym])
        return cardHTML(data[sym]);

      return `
        <div class="card">
          <b>${sym}</b>
          <div
            class="error"
            style="display:block">
            Waiting for market data.
          </div>
        </div>
      `;

    }).join('');

  symbols.forEach(sym => {

    if(data[sym]){

      draw(data[sym]);

      attachHover(data[sym]);
    }

  });

  renderWatch();
  renderIndexes();
  renderMovers();
}

    ['dji','I:DJI']
  ].forEach(([id,sym]) => {

    const d =

    if(!d)return;

    const value =
      document.getElementById(
        id + '-value'
      );

    const change =
      document.getElementById(
        id + '-change'
      );

    if(value){

      value.textContent =
        Number(d.price).toLocaleString(
          'en-US',
          {
            maximumFractionDigits:2
          }
        );
    }

    if(change){

      change.textContent =
        pct(d.percent);

      change.className =
        'mini-change ' +
        (
          d.change >= 0
            ? 'up'
            : 'down'
        );
    }

  });
}

/* ------------------------------------------------------------
   MOVERS
------------------------------------------------------------ */

function renderMovers(){

  const list =
    WATCH_DEFAULTS
      .map(sym => data[sym])
      .filter(Boolean)
      .sort(
        (a,b) =>
          b.percent-a.percent
      )
      .slice(0,6);

  document.getElementById(
    'movers'
  ).innerHTML =

    list.map(d => `

      <div class="row">

        <div class="row-left">

          <div class="badge">
            ${d.sym.slice(0,2)}
          </div>

          <div>

            <div class="row-name">
              ${d.sym}
            </div>

            <div class="row-sub">
              ${names[d.sym] || d.sym}
            </div>

          </div>

        </div>

        <div class="row-right">

          <div>
            ${fmt(d.price)}
          </div>

          <div class="${d.change >= 0 ? 'up' : 'down'}">
            ${pct(d.percent)}
          </div>

        </div>

      </div>

    `).join('')

    ||
    '<div class="muted">No data yet.</div>';
}

/* ------------------------------------------------------------
   CHANGE CHART RANGE
------------------------------------------------------------ */

function setRange(sym,range){

  ranges[sym] = range;

  load(sym).catch(() => {});
}

/* ------------------------------------------------------------
   ADD TICKER
------------------------------------------------------------ */

function addSymbol(){

  let sym =
    document.getElementById(
      'symbolInput'
    ).value
      .trim()
      .toUpperCase()
      .replace(
        /[^A-Z0-9.\-]/g,
        ''
      );

  if(!sym)return;

  if(!symbols.includes(sym))
    symbols.push(sym);

  localStorage.setItem(
    'marketdesk_symbols',
    JSON.stringify(symbols)
  );

  document.getElementById(
    'symbolInput'
  ).value = '';

  load(sym).catch(() => {});
}

/* ------------------------------------------------------------
   WATCHLIST CLICK
------------------------------------------------------------ */

function addFromWatch(sym){

  if(!symbols.includes(sym)){

    symbols.push(sym);

    localStorage.setItem(
      'marketdesk_symbols',
      JSON.stringify(symbols)
    );

    load(sym).catch(() => {});
  }
}

/* ------------------------------------------------------------
   WATCH TOGGLE
------------------------------------------------------------ */

function toggleWatch(sym){

  if(sym === 'AMZN'){

    pinAmazon();
    return;
  }

  if(symbols.includes(sym)){

    symbols =
      symbols.filter(
        x => x !== sym
      );

  }else{

    symbols.push(sym);
  }

  symbols = [
    'AMZN',
    ...symbols.filter(
      x => x !== 'AMZN'
    )
  ];

  localStorage.setItem(
    'marketdesk_symbols',
    JSON.stringify(symbols)
  );

  render();
}

/* ------------------------------------------------------------
   RESET
------------------------------------------------------------ */

function resetSymbols(){

  symbols =
    DEFAULTS.slice();

  localStorage.setItem(
    'marketdesk_symbols',
    JSON.stringify(symbols)
  );

  refreshAll();
}

/* ------------------------------------------------------------
   REDRAW
------------------------------------------------------------ */

function redrawAll(){

  symbols.forEach(sym => {

    if(data[sym])
      draw(data[sym]);

  });
}

/* ------------------------------------------------------------
   AUTO REFRESH
------------------------------------------------------------ */

const autoRefresh =
  document.getElementById(
    'autoRefresh'
  );

if(autoRefresh){

  autoRefresh.addEventListener(
    'change',
    e => {

      clearInterval(
        refreshTimer
      );

      if(e.target.checked){

        refreshTimer =
          setInterval(
            refreshAll,
            LIVE_INTERVAL
          );
      }

    }
  );
}

/* ------------------------------------------------------------
   VOLUME TOGGLE
------------------------------------------------------------ */

const volumeToggle =
  document.getElementById(
    'showVolume'
  );

if(volumeToggle){

  volumeToggle.addEventListener(
    'change',
    redrawAll
  );
}

/* ------------------------------------------------------------
   WINDOW EVENTS
------------------------------------------------------------ */

window.addEventListener(
  'resize',
  redrawAll
);

/* ------------------------------------------------------------
   START
------------------------------------------------------------ */

refreshAll();

refreshTimer =
  setInterval(
    refreshAll,
    LIVE_INTERVAL
  );

setInterval(
  updatePulse,
  1000
);

updatePulse();
</script>
