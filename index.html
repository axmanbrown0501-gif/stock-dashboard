/* ============================================================

function el(id){
  return document.getElementById(id);

function setText(id,value){

function setHTML(id,value){

function on(id,event,fn){

}

/* ============================================================
   FORMATTING
   ============================================================ */

function fmt(n){
  return Number.isFinite(Number(n))
    ? '$' + Number(n).toLocaleString('en-US',{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })
    : '—';
}

function pct(n){
  return Number.isFinite(Number(n))
    ? (Number(n) >= 0 ? '+' : '') +
      Number(n).toFixed(2) +
      '%'
    : '—';
}

function compact(n){
  n = Number(n);

  if(!Number.isFinite(n)) return '—';

  if(n >= 1e12)
    return '$' + (n/1e12).toFixed(2) + 'T';

  if(n >= 1e9)
    return '$' + (n/1e9).toFixed(2) + 'B';

  if(n >= 1e6)
    return '$' + (n/1e6).toFixed(2) + 'M';

  return fmt(n);
}

/* ============================================================
   API
   ============================================================ */

function apiUrl(path,params={}){
  const url = new URL(API_BASE + path);

  Object.entries(params).forEach(([key,value])=>{
    if(
      value !== undefined &&
      value !== null &&
      value !== ''
    ){
      url.searchParams.set(key,value);
    }
  });

  url.searchParams.set('apiKey',MASSIVE_API_KEY);

  return url.toString();
}

async function api(path,params={}){
  if(
    !MASSIVE_API_KEY ||
    MASSIVE_API_KEY === 'PASTE_YOUR_NEW_MASSIVE_KEY_HERE'
  ){
    throw new Error(
      'Massive API key is missing.'
    );
  }

  const response = await fetch(
    apiUrl(path,params),
    {
      cache:'no-store',
      headers:{
        'Accept':'application/json'
      }
    }
  );

  const text = await response.text();

  let json;

  try{
    json = JSON.parse(text);
  }catch{
    throw new Error(
      'Massive returned a non-JSON response (' +
      response.status +
      ').'
    );
  }

  if(!response.ok){
    throw new Error(
      json.error ||
      json.message ||
      ('Massive API error ('+response.status+')')
    );
  }

  if(
    json.status === 'ERROR' ||
    json.status === 'error'
  ){
    throw new Error(
      json.error ||
      json.message ||
      'Massive API error.'
    );
  }

  return json;
}

/* ============================================================
   DATES
   ============================================================ */

function dateString(daysAgo=0){
  const d = new Date();

  d.setDate(
    d.getDate() - daysAgo
  );

  return d.toISOString().slice(0,10);
}

/* ============================================================
   RANGE
   ============================================================ */

function rangeSettings(range){

  if(range === '1d'){
    return {
      from:dateString(3),
      multiplier:5,
      timespan:'minute',
      limit:200
    };
  }

  if(range === '5d'){
    return {
      from:dateString(10),
      multiplier:15,
      timespan:'minute',
      limit:500
    };
  }

  if(range === '1mo'){
    return {
      from:dateString(45),
      multiplier:1,
      timespan:'hour',
      limit:500
    };
  }

  if(range === '3mo'){
    return {
      from:dateString(120),
      multiplier:1,
      timespan:'day',
      limit:500
    };
  }

  return {
    from:dateString(400),
    multiplier:1,
    timespan:'day',
    limit:500
  };
}

/* ============================================================
   SNAPSHOT
   ============================================================ */

async function fetchSnapshot(sym){

  const j = await api(
    '/v2/snapshot/locale/us/markets/stocks/tickers/' +
    encodeURIComponent(sym)
  );

  const ticker = j.ticker;

  if(!ticker){
    throw new Error(
      'No snapshot returned for ' + sym
    );
  }

  const day = ticker.day || {};
  const prev = ticker.prevDay || {};
  const trade = ticker.lastTrade || {};
  const minute = ticker.min || {};

  const price =
    Number(trade.p) ||
    Number(minute.c) ||
    Number(day.c) ||
    Number(prev.c);

  if(!Number.isFinite(price)){
    throw new Error(
      'No current price returned for ' + sym
    );
  }

  const previousClose =
    Number(prev.c) ||
    Number(day.c);

  const rawChange =
    Number(ticker.todaysChange);

  const rawPercent =
    Number(ticker.todaysChangePerc);

  const change =
    Number.isFinite(rawChange)
      ? rawChange
      : price - previousClose;

  const percent =
    Number.isFinite(rawPercent)
      ? rawPercent
      : (
          previousClose
            ? change / previousClose * 100
            : 0
        );

  return {
    sym,
    price,

    prev:
      Number.isFinite(previousClose)
        ? previousClose
        : price,

    change,
    percent,

    open:Number(day.o),
    high:Number(day.h),
    low:Number(day.l),
    volume:Number(day.v),

    fiftyTwoHigh:NaN,
    fiftyTwoLow:NaN,
    marketCap:NaN,

    points:[],

    lastUpdated:Number(
      ticker.updated
    )
  };
}

/* ============================================================
   CHART
   ============================================================ */

async function fetchChart(sym,range){

  const settings =
    rangeSettings(range);

  const j = await api(
    '/v2/aggs/ticker/' +
    encodeURIComponent(sym) +
    '/range/' +
    settings.multiplier +
    '/' +
    settings.timespan +
    '/' +
    settings.from +
    '/' +
    dateString(0),
    {
      adjusted:'true',
      sort:'asc',
      limit:settings.limit
    }
  );

  const results =
    Array.isArray(j.results)
      ? j.results
      : [];

  return results
    .map(p=>({
      t:Number(p.t),
      p:Number(p.c),
      o:Number(p.o),
      h:Number(p.h),
      l:Number(p.l),
      v:Number(p.v || 0)
    }))
    .filter(
      p=>Number.isFinite(p.p)
    );
}

/* ============================================================
   FULL QUOTE
   ============================================================ */

async function fetchQuote(
  sym,
  range='1d'
){

  const [
    snapshot,
    points
  ] = await Promise.all([
    fetchSnapshot(sym),
    fetchChart(sym,range)
  ]);

  snapshot.points = points;

  return snapshot;
}

/* ============================================================
   DRAW
   ============================================================ */

function draw(d){

  if(!d)return;

  const canvas =
    el('canvas-' + d.sym);

  if(!canvas)return;

  const box =
    canvas.getBoundingClientRect();

  const w =
    box.width;

  const h =
    box.height;

  if(!w || !h)return;

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.max(1,w*ratio);

  canvas.height =
    Math.max(1,h*ratio);

  const ctx =
    canvas.getContext('2d');

  if(!ctx)return;

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  const pts =
    Array.isArray(d.points)
      ? d.points
      : [];

  if(pts.length < 2){

    ctx.fillStyle =
      '#777c84';

    ctx.font =
      '13px Arial';

    ctx.fillText(
      'Chart data unavailable',
      18,
      h/2
    );

    return;
  }

  const pad = {
    l:10,
    r:10,
    t:18,
    b:showVol()
      ? 48
      : 18
  };

  const values =
    pts.map(p=>p.p);

  const min =
    Math.min(...values);

  const max =
    Math.max(...values);

  const range =
    max-min || 1;

  for(let i=1;i<5;i++){

    const y =
      pad.t +
      (h-pad.t-pad.b)*i/5;

    ctx.strokeStyle =
      '#171a1f';

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(w,y);

    ctx.stroke();
  }

  if(showVol()){

    const volumes =
      pts.map(
        p=>p.v || 0
      );

    const maxVolume =
      Math.max(...volumes) || 1;

    const barWidth =
      Math.max(
        1,
        (w-pad.l-pad.r) /
        pts.length
      );

    ctx.fillStyle =
      '#1e252b';

    pts.forEach((p,i)=>{

      const bh =
        (p.v || 0) /
        maxVolume *
        (h-pad.b-10);

      ctx.fillRect(
        pad.l+i*barWidth,
        h-4-bh,
        Math.max(
          1,
          barWidth*.65
        ),
        bh
      );

    });
  }

  ctx.beginPath();

  pts.forEach((p,i)=>{

    const x =
      pad.l +
      (w-pad.l-pad.r) *
      i/(pts.length-1);

    const y =
      pad.t +
      (h-pad.t-pad.b) *
      (
        1 -
        (p.p-min)/range
      );

    if(i === 0)
      ctx.moveTo(x,y);
    else
      ctx.lineTo(x,y);

  });

  ctx.strokeStyle =
    d.change >= 0
      ? '#00c805'
      : '#ff4d4d';

  ctx.lineWidth =
    2.2;

  ctx.lineJoin =
    'round';

  ctx.stroke();
}

/* ============================================================
   HOVER
   ============================================================ */

function attachHover(d){

  const wrap =
    el('wrap-' + d.sym);

  const tip =
    el('tip-' + d.sym);

  const cross =
    el('cross-' + d.sym);

  if(
    !wrap ||
    !tip ||
    !cross
  )return;

  wrap.onmousemove = e=>{

    if(
      !d.points ||
      d.points.length < 2
    )return;

    const rect =
      wrap.getBoundingClientRect();

    const x =
      Math.max(
        0,
        Math.min(
          rect.width,
          e.clientX -
          rect.left
        )
      );

    const index =
      Math.round(
        x / rect.width *
        (d.points.length-1)
      );

    const p =
      d.points[index];

    if(!p)return;

    const first =
      d.points[0].p;

    const change =
      first
        ? (p.p-first) /
          first * 100
        : 0;

    tip.style.display =
      'block';

    tip.style.left =
      Math.min(
        x+12,
        Math.max(
          0,
          rect.width-190
        )
      ) + 'px';

    tip.style.top =
      Math.max(
        8,
        e.clientY -
        rect.top -
        65
      ) + 'px';

    tip.innerHTML =
      '<b>' + fmt(p.p) +
      '</b><br>' +
      pct(change) +
      ' · ' +
      (
        p.p-first >= 0
          ? '+'
          : ''
      ) +
      fmt(p.p-first) +
      ' from period start<br>' +
      new Date(p.t)
        .toLocaleString() +
      '<br>O ' +
      fmt(p.o) +
      ' · H ' +
      fmt(p.h) +
      ' · L ' +
      fmt(p.l);

    cross.style.display =
      'block';

    cross.style.left =
      x + 'px';
  };

  wrap.onmouseleave = ()=>{

    tip.style.display =
      'none';

    cross.style.display =
      'none';

  };
}

async function load(sym){

  try{

    data[sym] =
      await fetchQuote(
        sym,
        ranges[sym] || '1d'
      );

    render();

    return data[sym];

  }catch(error){

    console.warn(
      'Could not load ' +
      sym +

      error

    const errorBox =
      el('err-' + sym);

    if(errorBox){

      errorBox.style.display =
        'block';

      errorBox.textContent =
        error.message ||
        'Could not load market data.';

    }

    throw error;
  }
}

/* ============================================================
   INDEX SNAPSHOTS
   ============================================================ */

async function fetchIndex(sym){

  const j =
    await api(
      '/v3/snapshot',
      {
        ticker:sym
      }
    );

  const result =
    j.results?.[0];

  if(!result){
    throw new Error(
      'No index data returned for ' +
      sym
    );
  }

  const session =
    result.session || {};

  const price =
    Number(session.price);

  const previous =
    Number(session.previous_close);

  const change =
    Number(session.change);

  const percent =
    Number(session.change_percent);

  if(!Number.isFinite(price)){
    throw new Error(
      'No index price returned for ' +
      sym
    );
  }

  return {
    sym,
    price,
    prev:previous,
    change,
    percent,
    open:Number(session.open),
    high:Number(session.high),
    low:Number(session.low),
    volume:Number(session.volume),
    points:[]
  };
}

/* ============================================================
   REFRESH
   ============================================================ */

async function refreshAll(){

  if(busy)return;

  busy = true;

  setHTML(
    'marketStatus',
    '<span class="status-dot"></span>Updating'
  );

  const all = [
    ...new Set([
      ...symbols,
      ...WATCH_DEFAULTS,
      ...Object.values(INDEXES)
    ])
  ];

  let success = 0;

  for(const sym of all){

    try{

      if(
        sym === 'I:SPX' ||
        sym === 'I:NDX' ||
        sym === 'I:DJI'
      ){

        data[sym] =
          await fetchIndex(sym);

      }else{

        data[sym] =
          await fetchQuote(
            sym,
            ranges[sym] || '1d'
          );
      }

      success++;

    }catch(error){

      console.warn(
        'Could not load ' +
        sym +
        ': ' +
        error.message
      );

    }

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          150
        )
    );
  }

  lastSuccessfulUpdate =
    new Date();

  render();

  setText(
    'update-time',
    lastSuccessfulUpdate
      .toLocaleTimeString()
  );

  setText(
    'connection-note',
    success
      ? 'Massive · ' +
        success +
        ' symbols loaded'
      : 'Waiting for data'
  );

  setHTML(
    'feedNotice',
    '<b style="color:#fff">Live feed:</b> ' +
    (
      success
        ? 'Connected to Massive.'
        : 'Could not connect to Massive.'
    )
  );

  setHTML(
    'marketStatus',
    success
      ? '<span class="status-dot"></span>Market data loaded'
      : '<span class="status-dot" style="background:#ff4d4d"></span>Live feed unavailable'
  );

  busy = false;
}

    ...symbols.filter(

/* ============================================================
   FULLSCREEN
   ============================================================ */

function fullscreenChart(sym){

  const wrap =
    el('wrap-' + sym);

  if(!wrap)return;

  wrap.classList.toggle(
    'fullscreen'
  );

  document.documentElement.style.overflow =
    wrap.classList.contains('fullscreen')
      ? 'hidden'
      : '';

  setTimeout(
    ()=>{
      if(data[sym])
        draw(data[sym]);
    },
    50
  );
}

document.addEventListener(
  'keydown',
  e=>{

    if(e.key === 'Escape'){

      document
        .querySelectorAll(
          '.chart-wrap.fullscreen'
        )
        .forEach(
          w =>
            w.classList.remove(
              'fullscreen'
            )
        );

      document.documentElement.style.overflow =
        '';

      redrawAll();
    }

  }
);

/* ============================================================
   MARKET CLOCK
   ============================================================ */

function updatePulse(){

  const now =
    new Date();

  const parts =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:MARKET_TZ,
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit',
        hour12:false
      }
    ).formatToParts(now);

  const h =
    Number(
      parts.find(
        x=>x.type==='hour'
      )?.value || 0
    );

  const m =
    Number(
      parts.find(
        x=>x.type==='minute'
      )?.value || 0
    );

  const mins =
    h*60+m;

  const weekday =
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:MARKET_TZ,
        weekday:'short'
      }
    ).format(now);

  const open =
    weekday !== 'Sat' &&
    weekday !== 'Sun' &&
    mins >= 570 &&
    mins < 960;

  setText(
    'market-session',
    open
      ? 'US market open'
      : 'US market closed / pre-market / after-hours'
  );

  setText(
    'market-countdown',
    open
      ? 'Closes in ' +
        Math.max(
          0,
          960-mins
        ) +
        'm'
      : 'Updates every 60s'
  );

  const amazon =
    data.AMZN;

  if(!amazon)return;

  const move =
    el('amzn-session-move');

  if(move){

    move.textContent =
      pct(amazon.percent);

    move.className =
      'row-right ' +
      (
        amazon.change >= 0
          ? 'up'
          : 'down'
      );
  }

  setText(
    'amzn-day-range',
    fmt(amazon.low) +
    ' — ' +
    fmt(amazon.high)
  );

  const span =
    amazon.high -
    amazon.low;

  setText(
    'amzn-range-position',
    span > 0
      ? Math.round(
          (
            amazon.price -
            amazon.low
          ) /
          span *
          100
        ) +
        '% of range'
      : '—'
  );
}

/* ============================================================
   RENDER
   ============================================================ */

function render(){

  const grid =
    el('stockGrid');

  if(grid){

    grid.innerHTML =
      symbols.map(sym=>{

        if(data[sym])
          return cardHTML(
            data[sym]
          );

        return `
          <div class="card">

            <b>${sym}</b>

            <div
              class="error"
              style="display:block">

              Waiting for market data.

            </div>

          </div>
        `;

      }).join('');

    symbols.forEach(sym=>{

      if(data[sym]){

        draw(data[sym]);

        attachHover(
          data[sym]
        );

      }

    });
  }

  renderWatch();
  renderIndexes();
  renderMovers();
}

/* ============================================================
   WATCHLIST
   ============================================================ */

function renderWatch(){

  const grid =
    el('watchgrid');

  if(!grid)return;

  const list =
    [
      ...WATCH_DEFAULTS,
      ...symbols
    ].filter(
      (s,i,a)=>
        a.indexOf(s) === i
    );

  grid.innerHTML =
    list.map(sym=>{

      const d =
        data[sym];

      return `

        <div
          class="watch"
          onclick="addFromWatch('${sym}')">

          <div class="watch-top">

            <div>

              <div class="watch-symbol">
                ${sym}
              </div>

              <div class="watch-name">
                ${names[sym] || sym}
              </div>

            </div>

            <button
              class="star ${
                symbols.includes(sym)
                  ? 'active'
                  : ''
              }"
              onclick="
                event.stopPropagation();
                toggleWatch('${sym}')
              ">
              ☆
            </button>

          </div>

          <div class="watch-price">
            ${d ? fmt(d.price) : '—'}
          </div>

          <div
            class="watch-change ${
              d && d.change >= 0
                ? 'up'
                : 'down'
            }">

            ${
              d
                ? pct(d.percent)
                : 'Loading…'
            }

          </div>

        </div>

      `;

    }).join('');
}

/* ============================================================
   INDEXES
   ============================================================ */

function renderIndexes(){

  [
    ['spx','I:SPX'],
    ['ndx','I:NDX'],
    ['dji','I:DJI']
  ].forEach(
    ([id,sym])=>{

      const d =
        data[sym];

      if(!d)return;

      const value =
        el(id+'-value');

      const change =
        el(id+'-change');

      if(value){

        value.textContent =
          Number(
            d.price
          ).toLocaleString(
            'en-US',
            {
              maximumFractionDigits:2
            }
          );
      }

      if(change){

        change.textContent =
          pct(d.percent);

        change.className =
          'mini-change ' +
          (
            d.change >= 0
              ? 'up'
              : 'down'
          );
      }

    }
  );
}

/* ============================================================
   MOVERS
   ============================================================ */

function renderMovers(){

  const box =
    el('movers');

  if(!box)return;

  const list =
    WATCH_DEFAULTS
      .map(
        sym=>data[sym]
      )
      .filter(Boolean)
      .sort(
        (a,b)=>
          b.percent-a.percent
      )
      .slice(0,6);

  box.innerHTML =
    list.map(d=>`

      <div class="row">

        <div class="row-left">

          <div class="badge">
            ${d.sym.slice(0,2)}
          </div>

          <div>

            <div class="row-name">
              ${d.sym}
            </div>

            <div class="row-sub">
              ${names[d.sym] || d.sym}
            </div>

          </div>

        </div>

        <div class="row-right">

          <div>
            ${fmt(d.price)}
          </div>

          <div
            class="${
              d.change >= 0
                ? 'up'
                : 'down'
            }">

            ${pct(d.percent)}

          </div>

        </div>

      </div>

    `).join('') ||
    '<div class="muted">No data yet.</div>';
}

/* ============================================================
   RANGE
   ============================================================ */

function setRange(sym,range){

  ranges[sym] =
    range;

  load(sym)
    .catch(()=>{});
}

/* ============================================================
   ADD SYMBOL
   ============================================================ */

function addSymbol(){

  const input =
    el('symbolInput');

  if(!input)return;

  let sym =
    input.value
      .trim()
      .toUpperCase()
      .replace(
        /[^A-Z0-9.\-]/g,
        ''
      );

  if(!sym)return;

  if(!symbols.includes(sym))
    symbols.push(sym);

  localStorage.setItem(
    'marketdesk_symbols',
    JSON.stringify(symbols)
  );

  input.value = '';

  load(sym)
    .catch(()=>{});
}

/* ============================================================
   WATCH CLICK
   ============================================================ */

function addFromWatch(sym){

  if(!symbols.includes(sym)){

    symbols.push(sym);

    localStorage.setItem(
      'marketdesk_symbols',
      JSON.stringify(symbols)
    );

    load(sym)
      .catch(()=>{});
  }
}

/* ============================================================
   TOGGLE WATCH
   ============================================================ */

function toggleWatch(sym){

  if(sym === 'AMZN'){

    pinAmazon();

    return;
  }

  if(symbols.includes(sym)){

    symbols =
      symbols.filter(
        x=>x !== sym
      );

  }else{

    symbols.push(sym);
  }

  symbols = [
    'AMZN',
    ...symbols.filter(
      x=>x !== 'AMZN'
    )
  ];

  localStorage.setItem(
    'marketdesk_symbols',
    JSON.stringify(symbols)
  );

  render();
}

/* ============================================================
   RESET
   ============================================================ */

function resetSymbols(){

  symbols =
    DEFAULTS.slice();

  localStorage.setItem(
    'marketdesk_symbols',
    JSON.stringify(symbols)
  );

  refreshAll();
}

/* ============================================================
   REDRAW
   ============================================================ */

function redrawAll(){

  symbols.forEach(sym=>{

    if(data[sym])
      draw(data[sym]);

  });
}

/* ============================================================
   EVENTS
   ============================================================ */

on(
  'autoRefresh',
  'change',
  e=>{

    clearInterval(
      refreshTimer
    );

    if(e.target.checked){

      refreshTimer =
        setInterval(
          refreshAll,
          LIVE_INTERVAL
        );
    }

  }
);

on(
  'showVolume',
  'change',
  redrawAll
);

window.addEventListener(
  'resize',
  redrawAll
);

/* ============================================================
   START
   ============================================================ */

refreshAll();

refreshTimer =
  setInterval(
    refreshAll,
    LIVE_INTERVAL
  );

setInterval(
  updatePulse,
  1000
);

updatePulse();

</script>
