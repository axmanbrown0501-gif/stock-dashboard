const fmt=n=>Number.isFinite(n)?'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const pct=n=>Number.isFinite(n)?(n>=0?'+':'')+n.toFixed(2)+'%':'—';

function compact(n){
 if(!Number.isFinite(n))return '—';
 if(n>=1e12)return '$'+(n/1e12).toFixed(2)+'T';
 if(n>=1e9)return '$'+(n/1e9).toFixed(2)+'B';
 if(n>=1e6)return '$'+(n/1e6).toFixed(2)+'M';
 return fmt(n);
}

function intervalForRange(r){
 if(r==='1d')return '5min';
 if(r==='5d')return '15min';
 if(r==='1mo')return '1h';
 return '1day';
}

function outputSizeForRange(r){
 if(r==='1d')return 100;
 if(r==='5d')return 300;
 if(r==='1mo')return 500;
 if(r==='3mo')return 500;
 return 260;
}

async function api(path,params={}){
 const url=new URL('https://api.twelvedata.com/'+path);
 Object.entries(params).forEach(([k,v])=>{
  if(v!==undefined&&v!==null&&v!=='')url.searchParams.set(k,v);
 });
 url.searchParams.set('apikey',TWELVE_DATA_KEY);

 const r=await fetch(url.toString(),{cache:'no-store'});
 if(!r.ok)throw Error('Market API request failed ('+r.status+')');

 const j=await r.json();
 if(j.status==='error'||j.code)throw Error(j.message||'Market API error');
 return j;
}

async function fetchQuote(sym,range='1d'){
 if(!TWELVE_DATA_KEY||TWELVE_DATA_KEY==='PASTE_YOUR_KEY_HERE')
  throw Error('Add your Twelve Data API key first.');

 const series=await api('time_series',{
  symbol:sym,
  interval:intervalForRange(range),
  outputsize:outputSizeForRange(range),
  order:'ASC',
  timezone:'America/New_York'
 });

 if(!series.values?.length)throw Error('No market data returned for '+sym);

 const points=series.values.map(v=>({
  t:Date.parse(v.datetime),
  p:Number(v.close),
  o:Number(v.open),
  h:Number(v.high),
  l:Number(v.low),
  v:Number(v.volume||0)
 })).filter(v=>Number.isFinite(v.p));

 if(points.length<1)throw Error('No usable prices returned for '+sym);

 const latest=points.at(-1);

 let q={};
 try{q=await api('quote',{symbol:sym});}catch(e){}

 const price=Number(q.close)||latest.p;
 const prev=Number(q.previous_close)||(points.length>1?points.at(-2).p:price);
 const change=Number(q.change)||(price-prev);
 const percent=Number(q.percent_change)||(prev?change/prev*100:0);

 return {
  sym,points,price,prev,change,percent,
  open:Number(q.open)||latest.o,
  high:Number(q.high)||latest.h,
  low:Number(q.low)||latest.l,
  volume:Number(q.volume)||latest.v,
  fiftyTwoHigh:Number(q.fifty_two_week?.high),
  fiftyTwoLow:Number(q.fifty_two_week?.low),
  marketCap:NaN
 };
}

function showVol(){
 return document.getElementById('showVolume')?.checked;
}

function draw(d){
 const c=document.getElementById('canvas-'+d.sym);
 if(!c)return;

 const box=c.getBoundingClientRect();
 const ratio=devicePixelRatio||1;
 const w=box.width,h=box.height;

 c.width=w*ratio;
 c.height=h*ratio;

 const x=c.getContext('2d');
 x.setTransform(ratio,0,0,ratio,0,0);
 x.clearRect(0,0,w,h);

 const pts=d.points;

 if(pts.length<2){
  x.fillStyle='#777c84';
  x.font='13px Arial';
  x.fillText('Chart data unavailable',18,h/2);
  return;
 }

 const pad={l:10,r:10,t:18,b:showVol()?48:18};
 const vals=pts.map(p=>p.p);
 const min=Math.min(...vals);
 const max=Math.max(...vals);
 const vr=max-min||1;

 for(let i=1;i<5;i++){
  const y=pad.t+(h-pad.t-pad.b)*i/5;
  x.strokeStyle='#171a1f';
  x.beginPath();
  x.moveTo(0,y);
  x.lineTo(w,y);
  x.stroke();
 }

 if(showVol()){
  const vols=pts.map(p=>p.v||0);
  const vm=Math.max(...vols)||1;
  const bw=Math.max(1,(w-pad.l-pad.r)/pts.length);

  x.fillStyle='#1e252b';

  pts.forEach((p,i)=>{
   const bh=(p.v||0)/vm*(h-pad.b+10-18);
   x.fillRect(pad.l+i*bw,h-4-bh,Math.max(1,bw*.65),bh);
  });
 }

 x.beginPath();

 pts.forEach((p,i)=>{
  const xx=pad.l+(w-pad.l-pad.r)*i/(pts.length-1);
  const yy=pad.t+(h-pad.t-pad.b)*(1-(p.p-min)/vr);

  if(i)x.lineTo(xx,yy);
  else x.moveTo(xx,yy);
 });

 x.strokeStyle=d.change>=0?'#00c805':'#ff4d4d';
 x.lineWidth=2.2;
 x.lineJoin='round';
 x.stroke();
}

function attachHover(d){
 const wrap=document.getElementById('wrap-'+d.sym);
 const tip=document.getElementById('tip-'+d.sym);
 const cross=document.getElementById('cross-'+d.sym);

 if(!wrap)return;

 wrap.onmousemove=e=>{
  if(d.points.length<2)return;

  const r=wrap.getBoundingClientRect();

  const xpos=Math.max(
   0,
   Math.min(r.width,e.clientX-r.left)
  );

  const i=Math.round(
   xpos/r.width*(d.points.length-1)
  );

  const p=d.points[i];
  const first=d.points[0].p;
  const ch=first?(p.p-first)/first*100:0;

  tip.style.display='block';
  tip.style.left=Math.min(xpos+12,r.width-170)+'px';
  tip.style.top=Math.max(8,e.clientY-r.top-58)+'px';

  tip.innerHTML=
   '<b>'+fmt(p.p)+'</b><br>'+
   pct(ch)+' · '+
   (p.p-first>=0?'+':'')+
   fmt(p.p-first)+
   ' from period start<br>'+
   new Date(p.t).toLocaleString()+
   '<br>O '+fmt(p.o)+
   ' · H '+fmt(p.h)+
   ' · L '+fmt(p.l);

  cross.style.display='block';
  cross.style.left=xpos+'px';
 };

 wrap.onmouseleave=()=>{
  tip.style.display='none';
  cross.style.display='none';
 };
}

async function load(sym){
 try{
  data[sym]=await fetchQuote(sym,ranges[sym]||'1d');
  render();
  return data[sym];
 }catch(e){
  const err=document.getElementById('err-'+sym);
  if(err){
   err.style.display='block';
   err.textContent=e.message;
  }
  throw e;
 }
}

async function refreshAll(){
 if(busy)return;
 busy=true;

 document.getElementById('marketStatus').innerHTML=
  '<span class="status-dot"></span>Updating';

 const all=[
  'AMZN','MSFT',
  ...WATCH_DEFAULTS,
  ...Object.values(INDEXES)
 ];

 for(const s of [...new Set(all)]){
  try{
   data[s]=await fetchQuote(s,ranges[s]||'1d');
  }catch(e){
   console.warn('Could not load '+s,e.message);
  }

  await new Promise(r=>setTimeout(r,150));
 }

 lastSuccessfulUpdate=new Date();

 render();

 const ok=Object.keys(data).length;

 document.getElementById('update-time').textContent=
  lastSuccessfulUpdate.toLocaleTimeString();

 document.getElementById('connection-note').textContent=
  ok?'Live quote polling · '+ok+' symbols':'Waiting for data';

 document.getElementById('feedNotice').innerHTML=
  '<b style="color:#fff">Live feed:</b> '+
  (ok?'Connected to Twelve Data.':'Add your Twelve Data API key.');

 document.getElementById('marketStatus').innerHTML=
  ok
   ?'<span class="status-dot"></span>Market data loaded'
   :'<span class="status-dot" style="background:#ff4d4d"></span>Live feed unavailable';

 busy=false;
}

function pinAmazon(){

 localStorage.setItem('marketdesk_symbols',JSON.stringify(symbols));
 render();
}

function fullscreenChart(sym){
 const w=document.getElementById('wrap-'+sym);
 if(!w)return;

 w.classList.toggle('fullscreen');

 document.documentElement.style.overflow=
  w.classList.contains('fullscreen')?'hidden':'';

 setTimeout(()=>draw(data[sym]),50);
}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  document.querySelectorAll('.chart-wrap.fullscreen')
   .forEach(w=>w.classList.remove('fullscreen'));

  document.documentElement.style.overflow='';
  redrawAll();
 }
});

function updatePulse(){
 const now=new Date();

 const parts=new Intl.DateTimeFormat(
  'en-US',
  {
   timeZone:MARKET_TZ,
   hour:'2-digit',
   minute:'2-digit',
   second:'2-digit',
   hour12:false
  }
 ).formatToParts(now);

 const h=+parts.find(x=>x.type==='hour').value;
 const m=+parts.find(x=>x.type==='minute').value;
 const mins=h*60+m;

 const weekday=new Intl.DateTimeFormat(
  'en-US',
  {
   timeZone:MARKET_TZ,
   weekday:'short'
  }
 ).format(now);

 const open=
  weekday!=='Sat' &&
  weekday!=='Sun' &&
  mins>=570 &&
  mins<960;

 document.getElementById('market-session').textContent=
  open
   ?'US market open'
   :'US market closed / pre-market / after-hours';

 document.getElementById('market-countdown').textContent=
  open
   ?'Closes in '+Math.max(0,960-mins)+'m'
   :'Updates every 60s';

 const a=data.AMZN;

 if(a){
  const el=document.getElementById('amzn-session-move');

  el.textContent=pct(a.percent);
  el.className='row-right '+(a.change>=0?'up':'down');

  document.getElementById('amzn-day-range').textContent=
   fmt(a.low)+' — '+fmt(a.high);

  const span=a.high-a.low;

  document.getElementById('amzn-range-position').textContent=
   span>0
    ?Math.round((a.price-a.low)/span*100)+'% of range'
    :'—';
 }
}

function render(){
 document.getElementById('stockGrid').innerHTML=
  symbols.map(s=>
   data[s]
    ?cardHTML(data[s])
    :`<div class="card">
       <b>${s}</b>
       <div class="error" style="display:block">
        Waiting for market data.
       </div>
      </div>`
  ).join('');

 symbols.forEach(s=>{
  if(data[s]){
   draw(data[s]);
   attachHover(data[s]);
  }
 });

 renderWatch();
 renderIndexes();
 renderMovers();
}

function renderWatch(){
 const list=[...WATCH_DEFAULTS,...symbols]
  .filter((s,i,a)=>a.indexOf(s)===i);

 document.getElementById('watchgrid').innerHTML=
  list.map(s=>{
   const d=data[s];

   return `<div class="watch"
     onclick="addFromWatch('${s}')">

     <div class="watch-top">
      <div>
       <div class="watch-symbol">${s}</div>
       <div class="watch-name">${names[s]||s}</div>
      </div>

      <button
       class="star ${symbols.includes(s)?'active':''}"
       onclick="event.stopPropagation();toggleWatch('${s}')">
       ☆
      </button>
     </div>

     <div class="watch-price">
      ${d?fmt(d.price):'—'}
     </div>

     <div class="watch-change ${d&&d.change>=0?'up':'down'}">
      ${d?pct(d.percent):'Loading…'}
     </div>

    </div>`;
  }).join('');
}

function renderIndexes(){
 [
  ['spx','SPX'],
  ['ndx','IXIC'],
  ['dji','DJI']
 ].forEach(([id,s])=>{
  const d=data[s];
  if(!d)return;

  document.getElementById(id+'-value').textContent=
   Number(d.price).toLocaleString(
    'en-US',
    {maximumFractionDigits:2}
   );

  const el=document.getElementById(id+'-change');

  el.textContent=pct(d.percent);
  el.className='mini-change '+(d.change>=0?'up':'down');
 });
}

function renderMovers(){
 const list=WATCH_DEFAULTS
  .map(s=>data[s])
  .filter(Boolean)
  .sort((a,b)=>b.percent-a.percent)
  .slice(0,6);

 document.getElementById('movers').innerHTML=
  list.map(d=>`
   <div class="row">

    <div class="row-left">
     <div class="badge">${d.sym.slice(0,2)}</div>

     <div>
      <div class="row-name">${d.sym}</div>
      <div class="row-sub">${names[d.sym]||d.sym}</div>
     </div>
    </div>

    <div class="row-right">
     <div>${fmt(d.price)}</div>
     <div class="${d.change>=0?'up':'down'}">
      ${pct(d.percent)}
     </div>
    </div>

   </div>
  `).join('')
  ||'<div class="muted">No data yet.</div>';
}

function setRange(s,r){
 ranges[s]=r;
 load(s).catch(()=>{});
}

function addSymbol(){
 let s=document.getElementById('symbolInput')
  .value.trim()
  .toUpperCase()
  .replace(/[^A-Z0-9.\-]/g,'');

 if(!s)return;

 if(!symbols.includes(s))symbols.push(s);

 localStorage.setItem(
  'marketdesk_symbols',
  JSON.stringify(symbols)
 );

 document.getElementById('symbolInput').value='';

 load(s).catch(()=>{});
}

function addFromWatch(s){
 if(!symbols.includes(s)){
  symbols.push(s);

  localStorage.setItem(
   'marketdesk_symbols',
   JSON.stringify(symbols)
  );

  load(s).catch(()=>{});
 }
}

function toggleWatch(s){
 if(s==='AMZN'){
  pinAmazon();
  return;
 }

 if(symbols.includes(s))
  symbols=symbols.filter(x=>x!==s);
 else
  symbols.push(s);

 symbols=[
  'AMZN',
  ...symbols.filter(x=>x!=='AMZN')
 ];

 localStorage.setItem(
  'marketdesk_symbols',
  JSON.stringify(symbols)
 );

 render();
}

function resetSymbols(){
 symbols=DEFAULTS.slice();

 localStorage.setItem(
  'marketdesk_symbols',
  JSON.stringify(symbols)
 );

 refreshAll();
}

function redrawAll(){
 symbols.forEach(s=>{
  if(data[s])draw(data[s]);
 });
}

document.getElementById('autoRefresh')
 .addEventListener('change',e=>{
  clearInterval(refreshTimer);

  if(e.target.checked)
   refreshTimer=setInterval(
    refreshAll,
    LIVE_INTERVAL
   );
 });

window.addEventListener('resize',redrawAll);

refreshAll();

refreshTimer=setInterval(
 refreshAll,
 LIVE_INTERVAL
);

setInterval(updatePulse,1000);

updatePulse();
</script>
